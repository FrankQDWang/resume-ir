  "apps/desktop/src/source-roots-panel.tsx",
  "apps/desktop/src/daemon-runtime.ts",
  "apps/desktop/src/daemon-runtime.test.ts",
  "apps/desktop/src/runtime-state.ts",
  "apps/desktop/src/runtime-state.test.ts",
  "ACTIVE_GOAL.toml",
  "PROGRESS.md",
  "perf/current-loop-state.json",
  "perf/active-slice-transition.json",
  "perf/fixtures/valid/synthetic-smoke-artifact-manifest.json",
  "perf/fixtures/valid/synthetic-smoke-baseline-report.json",
]
allowed_paths_role = "single_frontend_managed_root_progress_owner_and_serial_refresh_path"
primary_benchmark_lane = "first_searchable"
observation_stage = "L0_gui_import_progress"
optimization_layer = "L0"
optimization_layer_selected = true
hypothesis = "one canonical managed-root presentation owns the active-phase set and visible stage copy while the existing serial lifecycle poller alone owns active and idle refresh cadence; retaining one authoritative snapshot across a single transient read failure prevents the false deletion error banner without masking sustained failures"
expected_delta = "the card heading, progress sentence, accessibility announcement and refresh cadence consume one phase interpretation; exactly one scheduler reads managed roots; original concise phase copy is restored; one transient read failure preserves the last truthful card without an error banner; crawler exclusions are labelled 跳过的文件/目录"
negative_control = "any duplicated active-phase set, stage mapping, per-root status ladder, second managed-root scheduler, predicted progress, backend phase invention, false keyword-ready inference, immediate error banner over a retained authoritative snapshot, or suppression of sustained read failure must fail closed"
implementation_boundary = "frontend-only consolidation of existing managed-root snapshots, presentation and polling orchestration; no daemon, API, IPC, schema, publication, keyword-ready, model, query or persistence change"
resident_pool_workload = "not applicable; the GUI consumes the existing managed-root snapshot through one serial lifecycle polling owner"
resident_pool_acceptance = "not applicable; focused frontend tests and installed macOS GUI acceptance own this slice"
full_product_acceptance = "focused frontend tests, production frontend build, exact-commit macOS bundle and installed-App synthetic import/delete acceptance must prove one phase/presentation owner, one serialized scheduler, concise truthful stage changes, responsive confirmed progress, no transient false deletion error, and a sustained failure banner"
raw_profile_boundary = "no private path, filename, resume text, raw query, candidate result, token, PID, log, trace, database, index, model or cache bytes may enter tests, screenshots, git or GitHub"
rollback_condition = "revert if a second phase or scheduling owner remains, refreshes overlap, progress predicts beyond confirmed counts, one transient failure replaces a retained authoritative snapshot, sustained failures are hidden, or installed import/delete behavior regresses"
forbidden_scope = [
  "production_embedding_input_change",
  "production_model_id_change",
  "production_runtime_default_change",
  "native_ort_runtime_upgrade",
  "metadata_schema_change",
  "pooling_change",
  "batch_size_composition_or_order_change",
  "cpu_arena_enablement",
  "new_topology_or_thread_arm",
