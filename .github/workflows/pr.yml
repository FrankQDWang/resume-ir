name: PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust workspace
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore reviewed macOS PDFium static pack
        id: pdfium-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/resume-ir-macos-pdfium-static-pack
          key: macos-pdfium-${{ runner.arch }}-${{ hashFiles('apps/desktop/resources/pdf-renderer/aarch64-apple-darwin/source-contract.json', 'apps/desktop/scripts/build-macos-pdfium-static-pack.mjs', 'apps/desktop/scripts/macos-pdfium-static-pack.mjs', 'apps/desktop/scripts/macos-xcode-toolchain.mjs') }}

      - name: Build reviewed macOS PDFium static pack
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: npm run build:macos:pdfium

      - name: Verify reviewed macOS PDFium static pack
        id: pdfium-verify
        working-directory: apps/desktop
        run: npm run verify:macos:pdfium

      - name: Save reviewed macOS PDFium static pack
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/resume-ir-macos-pdfium-static-pack
          key: ${{ steps.pdfium-cache.outputs.cache-primary-key }}

      - name: Install OCR renderer dependencies
        run: |
          brew install poppler tesseract pango

      - name: Metadata
        run: cargo metadata --no-deps --locked

      - name: Search runtime boundary check
        run: python3 scripts/ci/check-search-runtime-boundary.py

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: CLI closed-loop check
        if: ${{ !cancelled() && steps.pdfium-verify.outcome == 'success' }}
        run: ./scripts/ci/check-cli-closed-loop.sh

      - name: Daemon closed-loop check
        if: ${{ !cancelled() && steps.pdfium-verify.outcome == 'success' }}
        run: ./scripts/ci/check-daemon-closed-loop.sh

      - name: License check
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-licenses.sh

      - name: Runbook check
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-runbooks.sh

      - name: Current-stage handoff check
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-current-stage-handoff.sh

      - name: Workflow check
        if: ${{ !cancelled() }}
        run: ./scripts/ci/check-workflows.sh

      - name: Benchmark smoke
        if: ${{ !cancelled() && steps.pdfium-verify.outcome == 'success' }}
        run: ./scripts/ci/check-benchmark-smoke.sh

  contract_check:
    name: contract-check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run contract check
        run: python3 scripts/ci/check-performance-contracts.py

  privacy_guard:
    name: privacy-guard
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run privacy guard
        run: python3 scripts/ci/check-private-evidence-redaction.py

  pr_budget:
    name: pr-budget
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run PR budget check
        run: python3 scripts/ci/check-pr-budget.py

  benchmark_lane_claims:
    name: benchmark-lane-claims
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run benchmark lane claims check
        run: python3 scripts/ci/check-benchmark-lanes.py

  gate_integrity:
    name: gate-integrity
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gate integrity check
        run: python3 scripts/ci/check-gate-integrity.py

  public_repo_guard:
    name: public-repo-guard
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run public repository guard
        run: ./scripts/ci/guard-public-repo.sh
