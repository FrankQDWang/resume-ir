[package]
name = "resume-embedding-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "resume-embedding-runtime"
path = "src/main.rs"

[features]
default = ["resident-embedding-pool-experiment"]
resident-embedding-pool-experiment = []

[dependencies]
embedding-protocol = { path = "../embedding-protocol" }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["api-24", "load-dynamic", "ndarray", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.23.1", default-features = false, features = ["fancy-regex"] }

[target.'cfg(unix)'.dependencies]
process-containment = { path = "../process-containment" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
